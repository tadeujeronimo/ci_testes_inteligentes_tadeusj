name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - dev
      - test
      - tests
      - feat/**
      - feature/**
      - bugfix/**
  pull_request:
    branches:
      - main
      - master

jobs:
  manual-tests:
    name: Manual Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run manual tests
        run: npm run test:manual

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-artifacts
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Report status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "PASSED"
          else
            echo "FAILED"
            exit 1
          fi

  ai-tests:
    name: AI-Assisted Tests
    runs-on: ubuntu-latest
    needs: manual-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run AI-assisted tests
        run: npm run test:ai

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-artifacts
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Report status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "PASSED"
          else
            echo "FAILED"
            exit 1
          fi